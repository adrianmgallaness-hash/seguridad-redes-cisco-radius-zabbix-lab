!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname R-2139
!
boot-start-marker
boot-end-marker
!
logging buffered 16384 debugging
enable secret 5 <ENABLE_HASH_OCULTO>
!
aaa new-model
!
!
aaa authentication login default local
aaa authentication login LAB_RADIUS group radius local
aaa authorization exec default local
aaa authorization exec LAB_EXEC group radius local
!
aaa session-id common
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
no ip dhcp use vrf connected
ip dhcp excluded-address 10.21.39.1 10.21.39.99
ip dhcp excluded-address 10.21.39.131
!
ip dhcp pool LAN-2139
   network 10.21.39.0 255.255.255.0
   default-router 10.21.39.1
   dns-server 10.21.39.10
   domain-name lab2139.local
!
!
no ip domain lookup
ip domain name lab2139.local
!
!
!
!
username admin2139 privilege 15 secret 5 <USUARIO_HASH_OCULTO>
!
!
ip tcp synwait-time 5
ip ssh time-out 60
ip ssh version 2
!
!
!
!
interface FastEthernet0/0
 description CONEXION-SW-2139
 ip address 10.21.39.1 255.255.255.0
 speed 100
 full-duplex
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ip radius source-interface FastEthernet0/0
access-list 20 permit 10.21.39.0 0.0.0.255
snmp-server community <COMUNIDAD_SNMP_OCULTA> RO 20
snmp-server location GNS3-LAB-2139
no cdp log mismatch duplex
!
radius-server host 10.21.39.10 auth-port 1812 acct-port 1813 key 7 <SECRETO_RADIUS_OCULTO>
!
control-plane
!
!
!
banner motd ^CACCESO RESTRINGIDO - LABORATORIO DE SEGURIDAD DE REDES^C
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 exec-timeout 5 0
 authorization exec LAB_EXEC
 login authentication LAB_RADIUS
 transport input ssh
!
!
end
